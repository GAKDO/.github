<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="TRACE 서비스 구성도">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52525b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2f9e5b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c8161d"/></marker>
  </defs>
  <style>
    .t{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace}
    .live{stroke-dasharray:5 7;animation:d 1s linear infinite}
    @keyframes d{to{stroke-dashoffset:-12}}
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.live,.pulse{animation:none}}
  </style>
  <rect width="1200" height="600" rx="20" fill="#0b0b0f"/>
  <g class="t">
    <text x="48" y="54" fill="#ff5a5f" font-size="14" font-weight="700" letter-spacing="2">ARCHITECTURE</text>
    <text x="48" y="86" fill="#fff" font-size="26" font-weight="800" letter-spacing="-1">입구는 하나, 서버끼리는 이벤트로</text>

    <!-- 현장 -->
    <text x="48" y="130" fill="#71717a" font-size="13" font-weight="700">현장 · 사용자</text>
    <g font-size="14.5" fill="#e4e4e7">
      <rect x="48" y="142" width="210" height="62" rx="12" fill="#14261b" stroke="#2f9e5b"/>
      <text x="66" y="168" font-weight="700">부스 Jetson Orin Nano</text><text x="66" y="190" fill="#9ca3af" font-size="12.5">C920 ×2 · YOLO11-seg TensorRT</text>
      <rect x="48" y="216" width="210" height="52" rx="12" fill="#16161c" stroke="#2c2c33"/>
      <text x="66" y="247" font-weight="700">고객 폰 · 수령 촬영</text>
      <rect x="48" y="280" width="210" height="52" rx="12" fill="#16161c" stroke="#2c2c33"/>
      <text x="66" y="311" font-weight="700">관리자 · 부스 태블릿</text>
      <rect x="48" y="344" width="210" height="62" rx="12" fill="#16161c" stroke="#2c2c33"/>
      <text x="66" y="370" font-weight="700">진단 에이전트</text><text x="66" y="392" fill="#9ca3af" font-size="12.5">배터리 · SSD · 부품 (mac · Win)</text>
    </g>

    <!-- 입구 -->
    <path d="M258 173 H 290 M258 242 H 290 M258 306 H 290 M258 375 H 290 M290 173 V 375" stroke="#3f3f46" stroke-width="1.6" fill="none"/>
    <path class="live" d="M290 274 H 318" stroke="#c8161d" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
    <rect x="322" y="214" width="150" height="120" rx="14" fill="#c8161d"/>
    <text x="397" y="252" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">gakdo.site</text>
    <text x="397" y="276" fill="#ffd5d6" font-size="12.5" text-anchor="middle">HTTPS 443 하나</text>
    <text x="397" y="306" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">web nginx</text>
    <text x="397" y="324" fill="#ffd5d6" font-size="11.5" text-anchor="middle">React 화면 · /api 프록시</text>

    <path d="M472 274 H 520" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <rect x="524" y="226" width="140" height="96" rx="14" fill="#16161c" stroke="#3b6fd8"/>
    <text x="594" y="262" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">gateway</text>
    <text x="594" y="284" fill="#9ca3af" font-size="12" text-anchor="middle">JWT 검증 · 역할×경로</text>
    <text x="594" y="302" fill="#9ca3af" font-size="12" text-anchor="middle">요청 제한</text>

    <!-- 서버 5개 -->
    <text x="712" y="130" fill="#71717a" font-size="13" font-weight="700">Spring Boot 서버 5개</text>
    <g font-size="14.5" fill="#e4e4e7">
      <g transform="translate(712 142)"><rect width="230" height="48" rx="10" fill="#16161c" stroke="#3b6fd8"/><text x="16" y="21" font-weight="700" class="m" font-size="13.5">auth-server</text><text x="16" y="39" fill="#9ca3af" font-size="12">로그인 · QR · 페어링 · JWKS</text></g>
      <g transform="translate(712 198)"><rect width="230" height="48" rx="10" fill="#16161c" stroke="#3b6fd8"/><text x="16" y="21" font-weight="700" class="m" font-size="13.5">rental-server</text><text x="16" y="39" fill="#9ca3af" font-size="12">기종 · 기기 · 렌탈 · 시점</text></g>
      <g transform="translate(712 254)"><rect width="230" height="48" rx="10" fill="#14261b" stroke="#2f9e5b"/><text x="16" y="21" font-weight="700" class="m" font-size="13.5">capture-server</text><text x="16" y="39" fill="#9ca3af" font-size="12">촬영 세트 · 탐지 · 검수 · 등급</text></g>
      <g transform="translate(712 310)"><rect width="230" height="48" rx="10" fill="#16161c" stroke="#3b6fd8"/><text x="16" y="21" font-weight="700" class="m" font-size="13.5">diagnostics-server</text><text x="16" y="39" fill="#9ca3af" font-size="12">진단 검증 · 전후 비교</text></g>
      <g transform="translate(712 366)"><rect width="230" height="48" rx="10" fill="#16161c" stroke="#3b6fd8"/><text x="16" y="21" font-weight="700" class="m" font-size="13.5">report-server</text><text x="16" y="39" fill="#9ca3af" font-size="12">해시 체인 봉인 · 검증 · SSE</text></g>
    </g>
    <g stroke="#52525b" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M664 274 C 688 274 688 166 708 166"/><path d="M664 274 C 688 274 688 222 708 222"/>
      <path d="M664 274 H 708"/><path d="M664 274 C 688 274 688 334 708 334"/><path d="M664 274 C 688 274 688 390 708 390"/>
    </g>

    <!-- 인프라 -->
    <text x="990" y="130" fill="#71717a" font-size="13" font-weight="700">공통 인프라</text>
    <g font-size="14" fill="#e4e4e7">
      <g transform="translate(990 142)"><rect width="162" height="48" rx="10" fill="#121216" stroke="#3a3a42"/><text x="16" y="21" font-weight="700">PostgreSQL</text><text x="16" y="39" fill="#9ca3af" font-size="11.5">서버별 스키마</text></g>
      <g transform="translate(990 198)"><rect width="162" height="76" rx="10" fill="#121216" stroke="#c8161d"/><text x="16" y="24" font-weight="700">RabbitMQ</text><text x="16" y="44" fill="#ff8a8e" font-size="11.5" class="m">trace.events</text><text x="16" y="62" fill="#9ca3af" font-size="11.5">서버 사이 유일한 길</text></g>
      <g transform="translate(990 282)"><rect width="162" height="48" rx="10" fill="#121216" stroke="#3a3a42"/><text x="16" y="21" font-weight="700">MinIO</text><text x="16" y="39" fill="#9ca3af" font-size="11.5">사진 · 사전 서명 URL</text></g>
      <g transform="translate(990 338)"><rect width="162" height="48" rx="10" fill="#121216" stroke="#3a3a42"/><text x="16" y="21" font-weight="700">Redis</text><text x="16" y="39" fill="#9ca3af" font-size="11.5">요청 제한 · 진행률</text></g>
    </g>
    <path d="M942 166 H 964 M942 222 H 964 M942 278 H 964 M942 334 H 964 M942 390 H 964 M964 166 V 390" stroke="#3f3f46" stroke-width="1.6" fill="none"/>
    <path d="M964 166 H 986" stroke="#52525b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path class="live" d="M964 236 H 986" stroke="#c8161d" stroke-width="2" fill="none" marker-end="url(#r)"/>

    <!-- 사진 직접 업로드 -->
    <path class="live" d="M153 142 V 110 H 1172 V 306 H 1156" stroke="#2f9e5b" stroke-width="1.8" fill="none" opacity=".85" marker-end="url(#g)"/>
    <text x="640" y="102" fill="#5fd18a" font-size="12" text-anchor="middle">사진은 서버를 거치지 않고 사전 서명 URL로 바로 업로드 · SHA-256 확인</text>

    <!-- 학습 경로 -->
    <rect x="48" y="452" width="1104" height="104" rx="16" fill="#101014" stroke="#2c2c33" stroke-dasharray="5 5"/>
    <text x="72" y="484" fill="#71717a" font-size="13" font-weight="700">학습 경로 (서비스 밖)</text>
    <g font-size="14" fill="#e4e4e7">
      <text x="72" y="520" font-weight="700">부스 학습 사진</text>
      <text x="236" y="520" fill="#52525b">→</text>
      <text x="268" y="520" font-weight="700">Label Studio 라벨링 · 사람 검수 결과</text>
      <text x="580" y="520" fill="#52525b">→</text>
      <text x="612" y="520" font-weight="700">집 PC RTX 4070 Ti · YOLO11-seg 학습</text>
      <text x="912" y="520" fill="#52525b">→</text>
      <text x="944" y="520" font-weight="700" fill="#ff8a8e">같은 모델을 부스·서버에</text>
      <text x="72" y="542" fill="#9ca3af" font-size="12">AI는 흠집 후보를 넓게 잡고, 관리자가 확정한 것만 등급과 봉인에 들어갑니다. 확정·기각 결과는 다음 학습 데이터가 됩니다.</text>
    </g>
    <circle class="pulse" cx="1132" cy="480" r="5" fill="#c8161d"/>
  </g>
</svg>
